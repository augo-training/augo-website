# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install
      - name: Check required build secrets
        env:
          VITE_MIXPANEL_TOKEN: ${{ secrets.MIXPANEL }}
          VITE_MERCI_CODE_WEBHOOK_URL: ${{ secrets.VITE_MERCI_CODE_WEBHOOK_URL }}
          VITE_MERCI_REDEEM_WEBHOOK_URL: ${{ secrets.VITE_MERCI_REDEEM_WEBHOOK_URL }}
        run: |
          # /merci is invitation-only: with no webhook to ask, the door rejects
          # every code on the printed cards and the coach sees an error. Better
          # to fail the build than to ship that.
          for name in VITE_MERCI_CODE_WEBHOOK_URL VITE_MERCI_REDEEM_WEBHOOK_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name repo secret is not set; /merci would reject every invitation code."
              exit 1
            fi
            if ! printf '%s' "$value" | grep -Eq '^https://hook\.[a-z0-9-]+\.make\.com/[a-z0-9]{32}$'; then
              echo "::error::$name is not a Make webhook URL (https://hook.<zone>.make.com/<32 chars>)."
              exit 1
            fi
          done
          if [ -z "$VITE_MIXPANEL_TOKEN" ]; then
            echo "::error::MIXPANEL repo secret is not set; the build would ship without analytics."
            exit 1
          fi
          # A Mixpanel project token is exactly 32 hex characters. Anything else
          # (e.g. "VITE_MIXPANEL_TOKEN = abc..." pasted with the key name) makes
          # Mixpanel silently drop every event.
          if ! printf '%s' "$VITE_MIXPANEL_TOKEN" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::MIXPANEL repo secret is not a bare 32-character hex Mixpanel project token."
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          VITE_SIGNUP_WEBHOOK_URL: ${{ secrets.VITE_SIGNUP_WEBHOOK_URL }}
          VITE_MAILERLITE_GROUP_ID: ${{ secrets.VITE_MAILERLITE_GROUP_ID }}
          VITE_MAILERLITE_HUMANEDGE_GROUP_ID: ${{ secrets.VITE_MAILERLITE_HUMANEDGE_GROUP_ID }}
          # The repo secret is named MIXPANEL (not VITE_MIXPANEL_TOKEN). Vite only
          # exposes VITE_-prefixed vars, so it is mapped here.
          VITE_MIXPANEL_TOKEN: ${{ secrets.MIXPANEL }}
          # The two Make webhooks behind /merci. Unset, the page has no endpoints
          # to call and rejects every invitation code, so the guard step above
          # fails the build rather than shipping a door nobody can open.
          VITE_MERCI_CODE_WEBHOOK_URL: ${{ secrets.VITE_MERCI_CODE_WEBHOOK_URL }}
          VITE_MERCI_REDEEM_WEBHOOK_URL: ${{ secrets.VITE_MERCI_REDEEM_WEBHOOK_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
