<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>session zero share card</title>
    <!--
      The /session-zero social share card, captured by scripts/generate-og-image.ts
      into public/session-zero-og-v2.jpg.

      Static rather than a screenshot of the page: the page body renders only in
      the browser and the card is the one part of the invitation a crawler is
      allowed to see, so it says exactly what the head tags say. The name, the
      city, the date. No agenda, no seat count, no audience.

      Behind the words, the hero clip's best moment: session-zero-dive.jpg is the
      frame at 2.00s of src/assets/videos/session-zero-hero.mp4, the swimmer fully
      off the block. It gets the hero's own treatment (the same filter as
      MEDIA_STYLE in SessionZeroHero.tsx, the same dim, black pulled in from the
      left and the bottom) and is pushed right so the headline sits on the dark
      side and the swimmer has the rest.

      The frame is 1200x630 because that is what the og:image:width/height tags
      on the page claim. Change one and the other starts lying.

      Fonts come from the same two stylesheets index.html loads. The generator
      waits for networkidle2 and then two seconds, which covers the fetch.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        /* --color-dark, the site's background. */
        background: #0a0a0a;
        color: #ffffff;
        box-sizing: border-box;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* The photo and its overlays, under everything else. */
      .photo,
      .dim,
      .fade {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
      }
      .photo {
        width: 1080px;
        height: 100%;
        object-fit: cover;
        object-position: 100% 30%;
        filter: brightness(0.8) contrast(1.08);
      }
      .dim,
      .fade {
        left: 0;
      }
      .dim {
        background: rgba(10, 10, 10, 0.2);
      }
      .fade {
        background:
          linear-gradient(to right, #0a0a0a 0%, #0a0a0a 14%, rgba(10, 10, 10, 0.8) 34%, rgba(10, 10, 10, 0) 60%),
          linear-gradient(to top, #0a0a0a 0%, rgba(10, 10, 10, 0.75) 18%, rgba(10, 10, 10, 0) 42%),
          linear-gradient(to bottom, rgba(10, 10, 10, 0.6) 0%, rgba(10, 10, 10, 0) 22%);
      }
      .top,
      .middle,
      .bottom {
        position: relative;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .top img {
        height: 30px;
        width: auto;
        display: block;
      }
      .top .mono {
        color: rgba(255, 255, 255, 0.7);
      }
      .middle {
        display: flex;
        align-items: flex-start;
        gap: 32px;
      }
      /* The one shape of colour on the card: a bar in the brand gradient. */
      .bar {
        width: 6px;
        height: 262px;
        margin-top: 6px;
        border-radius: 3px;
        background: linear-gradient(180deg, #c50017 0%, #ff5514 60%, #ffca1e 100%);
        flex: none;
      }
      .eyebrow {
        color: #ffffff;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-family: 'Satoshi', 'Inter', sans-serif;
        font-weight: 700;
        font-size: 112px;
        line-height: 0.95;
        letter-spacing: -0.035em;
      }
      h1 span {
        display: block;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
      }
      .bottom .mono {
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <img class="photo" src="session-zero-dive.jpg" alt="" />
    <div class="dim"></div>
    <div class="fade"></div>
    <div class="top">
      <img src="../../src/assets/images/augo_footer_1.svg" alt="augo" />
      <span class="mono">Private &middot; by invitation</span>
    </div>
    <div class="middle">
      <div class="bar"></div>
      <div>
        <div class="mono eyebrow">Future of Coaching</div>
        <h1><span>Session</span><span>Zero.</span></h1>
      </div>
    </div>
    <div class="bottom">
      <span class="mono">Zurich</span>
      <span class="mono">Friday 4 December 2026</span>
    </div>
  </body>
</html>
